name: 代码与安装检查

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: 安装 Python 依赖
        run: python -m pip install -e ".[dev,browser,server]"
      - name: 检查 Python
        run: python -m ruff check .
      - name: 测试 Python
        run: python -m pytest tests/ -q
      - name: 初始化并检查空资料库
        run: |
          python apps/admin/scripts/setup-library.py --init
          python apps/admin/scripts/setup-library.py
      - name: 安装应用依赖
        working-directory: apps
        run: bun install --frozen-lockfile
      - name: 检查应用类型
        working-directory: apps
        run: bun run check
      - name: 测试应用
        working-directory: apps
        run: bun run test
      - name: 构建管理界面
        working-directory: apps
        run: bun run build
