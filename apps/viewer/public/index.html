<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="上下滑动，沉浸浏览本地视频资料库。">
  <title>随看 · 本地视频</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="desktop-brand" aria-hidden="true"><img src="/icon.svg" alt=""><span>随看<small>每一刻，都值得再看</small></span></div>
  <main id="app" class="app" aria-label="本地视频播放器">
    <header class="topbar">
      <button class="icon-button" id="browse-button" aria-label="浏览作者"></button>
      <nav class="top-tabs" aria-label="视频排序">
        <button data-mode="recommend" class="selected" aria-current="page">推荐</button>
        <button data-mode="latest">最新</button>
      </nav>
      <button class="icon-button" id="search-button" aria-label="搜索视频"></button>
    </header>
    <button id="filter-chip" class="filter-chip" hidden></button>
    <section id="feed" class="feed" aria-label="上下滑动切换视频" tabindex="0"></section>
    <div id="feed-state" class="feed-state" role="status">
      <div class="state-mark"><img src="/icon.svg" alt=""></div>
      <h1 id="state-title">好内容，接着看</h1>
      <p id="state-message">正在连接你的视频资料库…</p>
      <button id="retry-button" class="primary-button" hidden>重新加载</button>
    </div>
    <div class="feed-counter" id="feed-counter" aria-live="off"></div>
    <button id="more-retry" class="more-retry" hidden>下一组加载失败 · 点击重试</button>
    <button id="sound-hint" class="sound-hint" hidden><span data-icon="volume"></span>点击开启声音</button>
    <nav class="bottom-nav" aria-label="主导航">
      <button id="home-button" class="active"><span class="nav-icon" data-icon="home"></span><span>首页</span></button>
      <button id="saved-button"><span class="nav-icon" data-icon="bookmark"></span><span>收藏</span><i id="saved-dot" hidden></i></button>
      <button id="authors-button"><span class="nav-icon" data-icon="users"></span><span>作者</span></button>
      <button id="sound-button" aria-label="开启声音"><span class="nav-icon" data-icon="muted"></span><span id="sound-label">静音</span></button>
    </nav>
  </main>
  <aside class="desktop-controls" aria-label="播放操作">
    <span class="desktop-label">随心看<br><strong>慢慢发现。</strong></span>
    <button id="previous-button" class="round-button" aria-label="上一个视频"></button>
    <button id="next-button" class="round-button" aria-label="下一个视频"></button>
    <span class="desktop-tip">上下滚动切换<br>空格 暂停 / 播放</span>
    <button id="fullscreen-button" class="round-button" aria-label="全屏播放"></button>
  </aside>
  <dialog id="search-dialog" class="sheet">
    <div class="sheet-heading"><h2>发现想看的</h2><button class="icon-button" data-close aria-label="关闭搜索"></button></div>
    <form id="search-form" class="search-form"><label class="search-field"><span data-icon="search"></span><input id="search-input" type="search" placeholder="搜索视频、作者" maxlength="200" autocomplete="off" aria-label="搜索视频、作者"></label><button type="submit" class="primary-button">搜索</button></form>
    <p class="sheet-note">从你的本地资料库中搜索</p>
  </dialog>
  <dialog id="authors-dialog" class="sheet author-sheet">
    <div class="sheet-heading"><div><p class="eyebrow">YOUR CREATORS</p><h2>喜欢的作者，都在这里</h2></div><button class="icon-button" data-close aria-label="关闭作者列表"></button></div>
    <form id="author-search-form" class="search-form"><label class="search-field"><span data-icon="search"></span><input id="author-search" type="search" placeholder="搜索作者" maxlength="200" autocomplete="off" aria-label="搜索作者"></label><button class="primary-button" type="submit">查找</button></form>
    <div id="author-list" class="author-list"></div>
    <button id="more-authors" class="more-button" hidden>加载更多作者</button>
    <p id="author-status" class="sheet-note" role="status"></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
