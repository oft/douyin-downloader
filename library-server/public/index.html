<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地视频资料库</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="#works" aria-label="本地视频资料库首页">
            <span class="brand-mark" aria-hidden="true">▶</span>
            <span>视频资料库<small>本地媒体管理</small></span>
        </a>
        <nav aria-label="资料库导航">
            <a href="#works" data-view="works"><span class="nav-icon" aria-hidden="true">▤</span>作品<span id="nav-works" class="nav-count"></span></a>
            <a href="#authors" data-view="authors"><span class="nav-icon" aria-hidden="true">◎</span>作者<span id="nav-authors" class="nav-count"></span></a>
            <a href="#issues" data-view="issues"><span class="nav-icon" aria-hidden="true">◇</span>异常<span id="nav-issues" class="nav-count accent"></span></a>
            <a href="#links" data-view="links"><span class="nav-icon" aria-hidden="true">↗</span>链接管理</a>
            <a href="#update" data-view="update"><span class="nav-icon" aria-hidden="true">↻</span>更新</a>
        </nav>
        <div class="sidebar-footer">
            <button id="open-douyin" class="scan-button" type="button" title="手动检查登录状态，登录信息会自动保存"><span aria-hidden="true">↗</span> 打开抖音</button>
            <div id="scan-state" class="scan-state" role="status"><span class="status-dot"></span><span id="scan-label">媒体异常未扫描</span></div>
            <div id="scan-time" class="scan-time"></div>
            <button id="scan-button" class="scan-button" type="button"><span aria-hidden="true">↻</span> 扫描媒体异常</button>
        </div>
    </aside>
    <main class="workspace">
        <header class="section-header">
            <div>
                <button id="back" class="back-link" type="button" aria-label="返回上一页" hidden>← 返回</button>
                <h1 id="heading">全部作品</h1>
                <div id="summary" class="summary" aria-live="polite"></div>
            </div>
            <div id="header-action"></div>
        </header>
        <section id="toolbar" class="toolbar" aria-label="筛选条件" hidden></section>
        <section id="results" aria-label="查询结果" aria-busy="true">
            <div class="empty"><span class="spinner" aria-hidden="true"></span><p>正在读取作品…</p></div>
        </section>
        <nav id="pagination" class="pagination" aria-label="翻页" hidden></nav>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
        <div id="modal-content">
            <header class="modal-header">
                <div id="modal-heading"><h2 id="modal-title"></h2><div id="modal-subtitle" class="summary"></div></div>
                <div class="modal-controls">
                    <button type="button" id="modal-fullscreen" class="secondary" hidden>全屏</button>
                    <button type="button" id="modal-close" class="icon-button" aria-label="关闭" autofocus>×</button>
                </div>
            </header>
            <div id="modal-body"></div>
        </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
</body>
</html>
